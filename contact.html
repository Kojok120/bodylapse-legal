<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodyLapse - Contact Us</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 20px;
            padding: 40px;
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        
        h1 {
            color: #007AFF;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-align: center;
        }
        
        .description {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
            font-size: 1.1em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #007AFF;
        }
        
        textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #0051D5;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .back-link {
            text-align: center;
            margin-top: 30px;
        }
        
        .back-link a {
            color: #007AFF;
            text-decoration: none;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        
        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <p class="description">アプリの要望・相談があったらこちらからお願いします<br>If you have any requests or questions about the app, please let us know</p>
        
        <div class="form-group">
            <label for="name">お名前 / Name</label>
            <input type="text" id="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">メールアドレス / Email</label>
            <input type="email" id="email" required>
        </div>
        
        <div class="form-group">
            <label for="subject">件名 / Subject</label>
            <input type="text" id="subject" required>
        </div>
        
        <div class="form-group">
            <label for="message">メッセージ / Message</label>
            <textarea id="message" required></textarea>
        </div>
        
        <button type="button" id="sendButton">メールで送信 / Send via Email</button>
        
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const sendButton = document.getElementById('sendButton');
                
                sendButton.addEventListener('click', function() {
                    const name = document.getElementById('name').value;
                    const email = document.getElementById('email').value;
                    const subject = document.getElementById('subject').value;
                    const message = document.getElementById('message').value;
                    
                    if (!name || !email || !subject || !message) {
                        alert('すべての項目を入力してください / Please fill in all fields');
                        return;
                    }
                    
                    const body = encodeURIComponent(`名前 / Name: ${name}\nメール / Email: ${email}\n\nメッセージ / Message:\n${message}`);
                    const encodedSubject = encodeURIComponent(`BodyLapse: ${subject}`);
                    const mailtoLink = `mailto:ajitama.kojok@gmail.com?subject=${encodedSubject}&body=${body}`;
                    
                    window.location.href = mailtoLink;
                });
            });
        </script>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
    
</body>
</html>
